version: '3.8'

# ============================================
# Production Docker Compose for D Cube's Place
# ============================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dcubes-app
    restart: unless-stopped
    
    ports:
      - "${PORT:-5000}:5000"
    
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL}
      
      # Database (REQUIRED)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      
      # Security (REQUIRED)
      - JWT_SECRET=${JWT_SECRET}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-12}
      
      # Telegram (Optional)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - KITCHEN_CHAT_ID=${KITCHEN_CHAT_ID}
      - BAR_CHAT_ID=${BAR_CHAT_ID}
      - MANAGER_CHAT_ID=${MANAGER_CHAT_ID}
      
      # Staff Authentication
      - STAFF_MANAGER_PIN=${STAFF_MANAGER_PIN}
      - STAFF_KITCHEN_PIN=${STAFF_KITCHEN_PIN}
      - STAFF_BAR_PIN=${STAFF_BAR_PIN}
      
      # Rate Limiting
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      
      # IP Whitelisting (HIGHLY RECOMMENDED)
      - IP_WHITELIST_ENABLED=${IP_WHITELIST_ENABLED:-false}
      - WHITELISTED_IPS=${WHITELISTED_IPS}
      
      # Data Retention
      - DATA_RETENTION_HOURS=${DATA_RETENTION_HOURS:-24}
      
      # Monitoring (Optional)
      - SENTRY_DSN=${SENTRY_DSN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service_name,environment"
        env: "OS_VERSION,NODE_VERSION"
    
    networks:
      - dcubes-network

  # Optional: Redis for session storage (recommended for production)
  # redis:
  #   image: redis:7-alpine
  #   container_name: dcubes-redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - dcubes-network

  # Optional: Nginx reverse proxy (recommended for production)
  # nginx:
  #   image: nginx:alpine
  #   container_name: dcubes-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - app
  #   networks:
  #     - dcubes-network

networks:
  dcubes-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

