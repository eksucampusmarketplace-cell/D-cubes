version: '3.8'

services:
  velour-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velour-app
    ports:
      - "3000:3000"
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost:3000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - KITCHEN_CHAT_ID=${KITCHEN_CHAT_ID}
      - BAR_CHAT_ID=${BAR_CHAT_ID}
      - MANAGER_CHAT_ID=${MANAGER_CHAT_ID}
    restart: unless-stopped
    networks:
      - velour-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  velour-network:
    driver: bridge
